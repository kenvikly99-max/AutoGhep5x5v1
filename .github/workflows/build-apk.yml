name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Rebuild Correct App Structure
      run: |
        # 1. Dọn dẹp cấu hình cũ
        rm -f build.gradle settings.gradle gradle.properties

        cat << 'EOF' > settings.gradle
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "AutoGhep5x5"
        include ':app'
        EOF

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
        EOF

        # 2. Đảm bảo cấu trúc thư mục
        mkdir -p app/src/main/java/com/example/autoghep5x5
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml

        # 3. Tạo AndroidManifest chuẩn đầy đủ Quyền & Khai báo Service
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">

            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>

            <application
                android:allowBackup="true"
                android:label="AutoGhép 5x5"
                android:supportsRtl="true"
                android:icon="@android:drawable/sym_def_app_icon"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">

                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>

                <!-- Dịch vụ Cửa Sổ Nổi (Floating) -->
                <service android:name=".FloatingButtonService" android:exported="false" />

                <!-- Dịch vụ Accessibility Auto Vuốt/Chạm -->
                <service
                    android:name=".AutoService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>

            </application>
        </manifest>
        EOF

        # 4. Tạo file cấu hình xml cho Accessibility
        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <?xml version="1.0" encoding="utf-8"?>
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeAllMask"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault"
            android:canPerformGestures="true"
            android:canRetrieveWindowContent="true"
            android:description="@string/app_name" />
        EOF

        echo '<resources><string name="app_name">AutoGhep5x5</string></resources>' > app/src/main/res/values/strings.xml

        # 5. Ghi đè file MainActivity.kt (Khắc phục văng app & Tích hợp đúng FloatingButtonService)
        cat << 'EOF' > app/src/main/java/com/example/autoghep5x5/MainActivity.kt
        package com.example.autoghep5x5

        import android.accessibilityservice.AccessibilityService
        import android.accessibilityservice.GestureDescription
        import android.content.Intent
        import android.graphics.Bitmap
        import android.graphics.Path
        import android.net.Uri
        import android.os.Build
        import android.os.Bundle
        import android.os.Handler
        import android.os.Looper
        import android.provider.Settings
        import android.widget.Button
        import android.widget.Toast
        import androidx.appcompat.app.AppCompatActivity
        import kotlin.math.abs

        class MainActivity : AppCompatActivity() {

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                
                val btn = Button(this).apply {
                    text = "BẬT CỬA SỔ NỔI AUTO 5x5"
                    setOnClickListener {
                        checkAndStartService()
                    }
                }
                setContentView(btn)

                checkAndStartService()
            }

            private fun checkAndStartService() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && !Settings.canDrawOverlays(this)) {
                    val intent = Intent(
                        Settings.ACTION_MANAGE_OVERLAY_PERMISSION, 
                        Uri.parse("package:$packageName")
                    )
                    startActivityForResult(intent, 1234)
                } else {
                    startAppService()
                }
            }

            private fun startAppService() {
                val intent = Intent(this, FloatingButtonService::class.java)
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    startForegroundService(intent)
                } else {
                    startService(intent)
                }
                Toast.makeText(this, "Đã khởi chạy Dịch vụ Auto!", Toast.LENGTH_SHORT).show()
            }

            override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                super.onActivityResult(requestCode, resultCode, data)
                if (requestCode == 1234) {
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.M && Settings.canDrawOverlays(this)) {
                        startAppService()
                    }
                }
            }

            companion object {
                fun compareBitmaps(bmp1: Bitmap, bmp2: Bitmap): Double {
                    var matchingPixels = 0
                    val totalPixels = bmp1.width * bmp1.height
                    val step = 4

                    for (x in 0 until bmp1.width step step) {
                        for (y in 0 until bmp1.height step step) {
                            val p1 = bmp1.getPixel(x, y)
                            val p2 = bmp2.getPixel(x, y)

                            val rDiff = abs((p1 shr 16 and 0xff) - (p2 shr 16 and 0xff))
                            val gDiff = abs((p1 shr 8 and 0xff) - (p2 shr 8 and 0xff))
                            val bDiff = abs((p1 and 0xff) - (p2 and 0xff))

                            if (rDiff + gDiff + bDiff < 45) {
                                matchingPixels++
                            }
                        }
                    }
                    return matchingPixels.toDouble() / (totalPixels / (step * step))
                }
            }
        }

        class AutoService : AccessibilityService() {
            private val handler = Handler(Looper.getMainLooper())

            override fun onAccessibilityEvent(event: android.view.accessibility.AccessibilityEvent?) {}
            override fun onInterrupt() {}

            fun dragAndDrop(startX: Float, startY: Float, endX: Float, endY: Float, onComplete: () -> Unit) {
                val path = Path().apply {
                    moveTo(startX, startY)
                    lineTo(endX, endY)
                }
                val gesture = GestureDescription.Builder()
                    .addStroke(GestureDescription.StrokeDescription(path, 0, 300))
                    .build()

                dispatchGesture(gesture, object : GestureResultCallback() {
                    override fun onCompleted(gestureDescription: GestureDescription?) {
                        handler.postDelayed({ onComplete() }, 400)
                    }
                }, null)
            }
        }
        EOF

        # 6. Bổ sung FloatingButtonService bị thiếu
        cat << 'EOF' > app/src/main/java/com/example/autoghep5x5/FloatingButtonService.kt
        package com.example.autoghep5x5

        import android.app.*
        import android.content.Context
        import android.content.Intent
        import android.graphics.PixelFormat
        import android.os.Build
        import android.os.IBinder
        import android.view.Gravity
        import android.view.WindowManager
        import android.widget.Button
        import androidx.core.app.NotificationCompat

        class FloatingButtonService : Service() {
            private lateinit var windowManager: WindowManager
            private lateinit var floatingView: Button

            override fun onBind(intent: Intent?): IBinder? = null

            override fun onCreate() {
                super.onCreate()
                createNotificationChannel()

                val notification = NotificationCompat.Builder(this, "AUTO_CHANNEL")
                    .setContentTitle("AutoGhép 5x5")
                    .setContentText("Cửa sổ Auto đang hoạt động...")
                    .setSmallIcon(android.R.drawable.sym_def_app_icon)
                    .build()

                startForeground(1, notification)

                windowManager = getSystemService(Context.WINDOW_SERVICE) as WindowManager
                floatingView = Button(this).apply {
                    text = "AUTO 5x5"
                    setOnClickListener {
                        // Nút bấm nổi trên màn hình game
                    }
                }

                val layoutParamsType = if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                } else {
                    WindowManager.LayoutParams.TYPE_PHONE
                }

                val params = WindowManager.LayoutParams(
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    WindowManager.LayoutParams.WRAP_CONTENT,
                    layoutParamsType,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE,
                    PixelFormat.TRANSLUCENT
                ).apply {
                    gravity = Gravity.TOP or Gravity.START
                    x = 100
                    y = 300
                }

                windowManager.addView(floatingView, params)
            }

            private fun createNotificationChannel() {
                if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) {
                    val channel = NotificationChannel("AUTO_CHANNEL", "Auto Service", NotificationManager.IMPORTANCE_LOW)
                    val manager = getSystemService(NotificationManager::class.java)
                    manager?.createNotificationChannel(channel)
                }
            }

            override fun onDestroy() {
                super.onDestroy()
                if (::floatingView.isInitialized) windowManager.removeView(floatingView)
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build APK
      run: gradle :app:assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoGhep5x5-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
