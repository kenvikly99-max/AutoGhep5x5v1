name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Wipe and Rebuild Project
      run: |
        # Xóa sạch mọi file cấu hình cũ trong thư mục app và gốc
        rm -rf app/build.gradle build.gradle settings.gradle
        
        # Tạo cấu trúc mới
        mkdir -p app/src/main/java/com/example/autoghep
        mkdir -p app/src/main/res/values

        # 1. settings.gradle
        echo "include ':app'" > settings.gradle

        # 2. Root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.8.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 3. app/build.gradle
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        apply plugin: 'kotlin-android'
        android {
            compileSdk 33
            defaultConfig {
                applicationId "com.example.autoghep"
                minSdk 24
                targetSdk 33
                versionCode 1
                versionName "1.0"
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.9.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF

        # 4. Tạo MainActivity.kt
        cat << 'EOF' > app/src/main/java/com/example/autoghep/MainActivity.kt
        package com.example.autoghep
        import androidx.appcompat.app.AppCompatActivity
        import android.os.Bundle
        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
            }
        }
        EOF

        # 5. Tạo Manifest
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.autoghep">
            <application android:label="AutoGhep" />
        </manifest>
        EOF

        # 6. Build
        ./gradlew assembleDebug --no-daemon

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoGhep-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
