name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Create Files
      run: |
        mkdir -p app/src/main/java/com/example/autoghep5x5
        
        # 1. Manifest
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <application android:allowBackup="true" android:label="AutoGhép" android:supportsRtl="true" android:icon="@android:drawable/sym_def_app_icon" android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity android:name=".MainActivity" android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service android:name=".FloatingButtonService" android:exported="false" />
                <service android:name=".AutoService" android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE" android:exported="true">
                    <intent-filter><action android:name="android.accessibilityservice.AccessibilityService" /></intent-filter>
                </service>
            </application>
        </manifest>
        EOF

        # 2. FloatingService
        cat << 'EOF' > app/src/main/java/com/example/autoghep5x5/FloatingButtonService.kt
        package com.example.autoghep5x5
        import android.app.*
        import android.os.*
        import android.view.*
        import android.widget.*
        import android.graphics.PixelFormat
        import androidx.core.app.NotificationCompat
        class FloatingButtonService : Service() {
            private lateinit var wm: WindowManager
            private lateinit var layout: LinearLayout
            override fun onBind(intent: android.content.Intent?) = null
            override fun onCreate() {
                super.onCreate()
                startForeground(1, NotificationCompat.Builder(this, "AUTO").setSmallIcon(android.R.drawable.sym_def_app_icon).build())
                wm = getSystemService(WINDOW_SERVICE) as WindowManager
                layout = LinearLayout(this).apply {
                    orientation = LinearLayout.VERTICAL
                    addView(Button(this@FloatingButtonService).apply { text="GÓC TRÁI"; setOnClickListener { AutoService.instance?.startCapture(1) } })
                    addView(Button(this@FloatingButtonService).apply { text="GÓC PHẢI"; setOnClickListener { AutoService.instance?.startCapture(2) } })
                    addView(Button(this@FloatingButtonService).apply { text="BẮT ĐẦU"; setOnClickListener { AutoService.instance?.toggleAuto() } })
                }
                val params = WindowManager.LayoutParams(-2, -2, if(Build.VERSION.SDK_INT>=26) 2038 else 2002, 8, PixelFormat.TRANSLUCENT)
                wm.addView(layout, params)
            }
        }
        EOF

        # 3. AutoService
        cat << 'EOF' > app/src/main/java/com/example/autoghep5x5/AutoService.kt
        package com.example.autoghep5x5
        import android.accessibilityservice.*
        import android.graphics.Path
        import android.view.accessibility.AccessibilityEvent
        class AutoService : AccessibilityService() {
            companion object { var instance: AutoService? = null }
            private var cap = 0; var x1=0f; var y1=0f; var x2=0f; var y2=0f; var isRun = false
            override fun onServiceConnected() { instance = this }
            fun startCapture(m: Int) { cap = m }
            fun toggleAuto() { isRun = !isRun }
            override fun onAccessibilityEvent(e: AccessibilityEvent?) {
                if (cap != 0 && e?.eventType == 1) {
                    if (cap==1) { x1=e.touchPointX; y1=e.touchPointY; cap=0 }
                    else { x2=e.touchPointX; y2=e.touchPointY; cap=0 }
                }
            }
            override fun onInterrupt() {}
        }
        EOF

        # 4. MainActivity
        cat << 'EOF' > app/src/main/java/com/example/autoghep5x5/MainActivity.kt
        package com.example.autoghep5x5
        import android.content.Intent
        import android.os.Bundle
        import androidx.appcompat.app.AppCompatActivity
        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                startService(Intent(this, FloatingButtonService::class.java))
                finish()
            }
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Build APK
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoGhep5x5-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
