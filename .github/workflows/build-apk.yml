name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with: {java-version: '17', distribution: 'temurin'}

    - name: Apply Unified Logic
      run: |
        mkdir -p app/src/main/java/com/example/autoghep5x5
        
        # 1. FloatingButtonService: Kết nối với AutoService
        cat << 'EOF' > app/src/main/java/com/example/autoghep5x5/FloatingButtonService.kt
        package com.example.autoghep5x5
        import android.app.*
        import android.content.Intent
        import android.os.*
        import android.view.*
        import android.widget.Button
        import android.graphics.PixelFormat
        import androidx.core.app.NotificationCompat

        class FloatingButtonService : Service() {
            private lateinit var windowManager: WindowManager
            private lateinit var btn: Button
            private var isRunning = false

            override fun onBind(intent: Intent?) = null
            override fun onCreate() {
                super.onCreate()
                startForeground(1, NotificationCompat.Builder(this, "AUTO_CHANNEL").setSmallIcon(android.R.drawable.sym_def_app_icon).build())
                windowManager = getSystemService(WINDOW_SERVICE) as WindowManager
                btn = Button(this).apply {
                    text = "BẮT ĐẦU"
                    setOnClickListener {
                        isRunning = !isRunning
                        text = if (isRunning) "DỪNG" else "BẮT ĐẦU"
                        // Gửi lệnh cho AutoService
                        AutoService.instance?.let { if (isRunning) it.startAuto() else it.stopAuto() }
                    }
                }
                val params = WindowManager.LayoutParams(WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.O) WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY else WindowManager.LayoutParams.TYPE_PHONE,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT)
                windowManager.addView(btn, params)
            }
        }
        EOF

        # 2. AutoService: Bộ não thực hiện Auto
        cat << 'EOF' > app/src/main/java/com/example/autoghep5x5/AutoService.kt
        package com.example.autoghep5x5
        import android.accessibilityservice.AccessibilityService
        import android.accessibilityservice.GestureDescription
        import android.graphics.Path
        import android.os.Handler
        import android.os.Looper
        import android.view.accessibility.AccessibilityEvent

        class AutoService : AccessibilityService() {
            companion object { var instance: AutoService? = null }
            private val handler = Handler(Looper.getMainLooper())
            private val runnable = object : Runnable {
                override fun run() {
                    // --- ĐÂY LÀ CHỖ BẠN CẦN CHỈNH TỌA ĐỘ ---
                    // Ví dụ: Kéo từ vị trí x=200, y=500 sang x=600, y=500
                    dragAndDrop(200f, 500f, 600f, 500f) 
                    handler.postDelayed(this, 2000) // Lặp lại mỗi 2 giây
                }
            }

            override fun onServiceConnected() { instance = this }
            fun startAuto() { handler.post(runnable) }
            fun stopAuto() { handler.removeCallbacks(runnable) }
            
            fun dragAndDrop(sx: Float, sy: Float, ex: Float, ey: Float) {
                val path = Path().apply { moveTo(sx, sy); lineTo(ex, ey) }
                dispatchGesture(GestureDescription.Builder().addStroke(GestureDescription.StrokeDescription(path, 0, 300)).build(), null, null)
            }
            override fun onAccessibilityEvent(e: AccessibilityEvent?) {}
            override fun onInterrupt() {}
        }
        EOF
        
        # (Giữ nguyên các file khác như MainActivity, AndroidManifest.xml... ở các bước trước)
    
    # ... (Các phần build khác giữ nguyên như cũ)
