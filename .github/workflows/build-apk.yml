name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    # Sử dụng action chính thức của Gradle để ép buộc phiên bản 8.2
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build from scratch
      run: |
        # 1. Tạo thư mục build sạch
        mkdir -p new_app/app/src/main/java/com/example/autoghep
        mkdir -p new_app/app/src/main/res/values
        cd new_app
        
        # 2. Tạo settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                gradlePluginPortal()
                mavenCentral()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        include ':app'
        EOF
        
        # 3. Tạo build.gradle (Root)
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.0' apply false
            id 'org.jetbrains.kotlin.android' version '1.8.0' apply false
        }
        EOF
        
        # 4. Tạo app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.example.autoghep'
            compileSdk 33
            defaultConfig {
                applicationId "com.example.autoghep"
                minSdk 24
                targetSdk 33
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.9.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF
        
        # 5. Tạo các file cần thiết
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.autoghep" />
        EOF
        
        cat << 'EOF' > app/src/main/java/com/example/autoghep/MainActivity.kt
        package com.example.autoghep
        import androidx.appcompat.app.AppCompatActivity
        import android.os.Bundle
        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
            }
        }
        EOF
        
        # 6. Build trực tiếp bằng gradle (đã được cấu hình ở bước setup-gradle)
        gradle assembleDebug --no-daemon

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoGhep-Debug
        path: new_app/app/build/outputs/apk/debug/app-debug.apk
