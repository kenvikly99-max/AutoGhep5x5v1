name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Build Project
      run: |
        # Xóa các file cấu hình thừa (nếu có) để tránh xung đột
        rm -f build.gradle settings.gradle gradle.properties

        # Tạo file cấu hình Gradle chuẩn để đọc code của bạn
        cat << 'EOF' > settings.gradle
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "AutoGhep5x5"
        include ':app'
        EOF

        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
        EOF

        # VÀI BƯỚC SỬA LỖI ICON (Để đảm bảo build không lỗi)
        # Chỉ áp dụng nếu project chưa có icon, nếu bạn đã có icon thì bước này vô hại
        sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@android:drawable/sym_def_app_icon"|g' app/src/main/AndroidManifest.xml || true
        sed -i 's|android:roundIcon="@mipmap/ic_launcher_round"|android:roundIcon="@android:drawable/sym_def_app_icon"|g' app/src/main/AndroidManifest.xml || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build APK
      run: gradle :app:assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoGhep5x5-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
