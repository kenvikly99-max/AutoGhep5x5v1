name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Auto Fix and Generate Complete App
      run: |
        rm -f build.gradle settings.gradle gradle.properties

        # 1. Settings Gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "AutoGhep5x5"
        include ':app'
        EOF

        # 2. Gradle Properties
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
        EOF

        # 3. Tạo thư mục chứa code Kotlin & tài nguyên
        mkdir -p app/src/main/java/com/example/autoghep5x5
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/res/xml
        
        # 4. Tạo MainActivity.kt chuẩn
        cat << 'EOF' > app/src/main/java/com/example/autoghep5x5/MainActivity.kt
        package com.example.autoghep5x5

        import android.os.Bundle
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
            }
        }
        EOF

        # 5. Strings & Resource
        echo '<resources><string name="app_name">AutoGhep5x5</string></resources>' > app/src/main/res/values/strings.xml

        if [ ! -f app/src/main/res/xml/accessibility_service_config.xml ]; then
          echo '<?xml version="1.0" encoding="utf-8"?><accessibility-service xmlns:android="http://schemas.android.com/apk/res/android" android:accessibilityEventTypes="typeAllMask" android:accessibilityFeedbackType="feedbackGeneric" android:accessibilityFlags="flagDefault" android:canPerformGestures="true" android:canRetrieveWindowContent="true" />' > app/src/main/res/xml/accessibility_service_config.xml
        fi

        # 6. AndroidManifest.xml chuẩn khớp package
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name="com.example.autoghep5x5.MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 7. App build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application' version '8.1.4'
            id 'org.jetbrains.kotlin.android' version '1.8.10'
        }

        android {
            namespace 'com.example.autoghep5x5'
            compileSdk 34

            defaultConfig {
                applicationId "com.example.autoghep5x5"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
        }
        EOF

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build APK
      run: gradle :app:assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoGhep5x5-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
