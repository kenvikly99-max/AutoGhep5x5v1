name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Safe Patch Project
      run: |
        # 1. Dọn dẹp cấu hình xung đột
        rm -f build.gradle settings.gradle gradle.properties

        # 2. Tạo settings.gradle chuẩn
        cat << 'EOF' > settings.gradle
        pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
        dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
        rootProject.name = "AutoGhep5x5"
        include ':app'
        EOF

        # 3. Tạo gradle.properties chuẩn
        cat << 'EOF' > gradle.properties
        android.useAndroidX=true
        android.enableJetifier=true
        org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m
        EOF

        # 4. Bổ sung file strings.xml bị thiếu
        mkdir -p app/src/main/res/values
        if [ ! -f app/src/main/res/values/strings.xml ]; then
          echo '<resources><string name="app_name">AutoGhep5x5</string></resources>' > app/src/main/res/values/strings.xml
        fi

        # 5. Sửa an toàn Manifest gốc: Thêm Theme chống văng & Thay icon bị thiếu
        # Thêm theme AppCompat vào thẻ <application> nếu chưa có
        sed -i 's/<application/<application android:theme="@style\/Theme.AppCompat.Light.NoActionBar"/g' app/src/main/AndroidManifest.xml || true
        
        # Thay icon hỏng bằng icon hệ thống Android
        sed -i 's|android:icon="@mipmap/ic_launcher"|android:icon="@android:drawable/sym_def_app_icon"|g' app/src/main/AndroidManifest.xml || true
        sed -i 's|android:roundIcon="@mipmap/ic_launcher_round"|android:roundIcon="@android:drawable/sym_def_app_icon"|g' app/src/main/AndroidManifest.xml || true

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.2'

    - name: Build APK
      run: gradle :app:assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoGhep5x5-Debug
        path: app/build/outputs/apk/debug/app-debug.apk
