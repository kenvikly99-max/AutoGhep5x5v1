name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: android-actions/setup-android@v3
      # Dùng setup-java là đủ, mình đổi sang cách build trực tiếp không dựa vào file cũ của repo
    
    - name: Build from scratch
      run: |
        # 1. Tạo dự án mới ở thư mục tạm 'new_app' để tránh đụng file cũ
        mkdir new_app
        cd new_app
        
        # 2. Tạo cấu trúc cần thiết
        mkdir -p app/src/main/java/com/example/autoghep
        mkdir -p app/src/main/res/values
        
        # 3. Tạo settings.gradle
        echo "include ':app'" > settings.gradle
        
        # 4. Tạo build.gradle (Root)
        cat << 'EOF' > build.gradle
        plugins {
            id 'com.android.application' version '8.1.0' apply false
            id 'org.jetbrains.kotlin.android' version '1.8.0' apply false
        }
        EOF
        
        # 5. Tạo app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }
        android {
            namespace 'com.example.autoghep'
            compileSdk 33
            defaultConfig {
                applicationId "com.example.autoghep"
                minSdk 24
                targetSdk 33
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.9.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
        }
        EOF
        
        # 6. Tạo Manifest & Code
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.example.autoghep" />
        EOF
        
        cat << 'EOF' > app/src/main/java/com/example/autoghep/MainActivity.kt
        package com.example.autoghep
        import androidx.appcompat.app.AppCompatActivity
        import android.os.Bundle
        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
            }
        }
        EOF
        
        # 7. Tự tạo wrapper và Build
        gradle wrapper --gradle-version 8.0
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: AutoGhep-Debug
        path: new_app/app/build/outputs/apk/debug/app-debug.apk
